# Deployment environments. Recipes never contain environment-specific IDs; push resolves them here.
# Edit only through a reviewed change. Tokens are NEVER stored here (env vars / secret store only).
default: dev

environments:
  dev:
    description: Free-plan trial workspace, environment "Development"
    data_center: trial
    api_base: https://app.trial.workato.com/api
    mcp_server: workato                  # registration name in .mcp.json
    token_env: WORKATO_API_TOKEN
    workspace: "aniketpitredflix's workspace"
    project:                             # where the lifecycle builds assets
      name: Test
      project_id: 50879
      folder_id: 74743
    # logical connection name (used in specs/designs) -> Workato connection id in this environment
    connections: {}                      # none authorized yet; e.g. crm: 123456, chat: 234567
    allow_start: approval                # approval | never  (go-live always needs the human gate)

  # test:
